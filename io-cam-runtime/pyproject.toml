[project]
name = "io-cam-runtime"
version = "0.1.0"
description = "IO-CAM pick & place Python runtime (vision + motion + conveyor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyserial>=3.5",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "ezdxf>=1.3.0",
    # NVIDIA CUDA: falcon-perception torch backend + ONNX GPU
    "falcon-perception[torch]>=1.0.0",
    # 1.27+ PyPI wheel CUDA 13 ister; runtime PyTorch CUDA 12.x (cu128).
    "onnxruntime-gpu==1.20.2",
    # Falcon FlexAttention Triton kernels (Windows community wheel)
    "triton-windows>=3.0.0; sys_platform == 'win32'",
    "triton>=3.0.0; sys_platform == 'linux'",
    # Windows: DirectShow kamera isimleri (Iriun / OBS / USB Webcam)
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # P2-C24: lint + type-check + coverage tooling.
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
